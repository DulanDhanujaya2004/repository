
<!DOCTYPE html>
<html lang="english">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePass - Password Strength Analyzer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0b111e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: rgba(22, 32, 50, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 750px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .header p {
            color: #7c8ba1;
            font-size: 14px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 220px;
            gap: 25px;
            align-items: start;
        }

        @media (max-width: 650px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 45px 14px 16px;
            background: #182335;
            border: 1px solid #28374f;
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #00e5ff;
        }

        .toggle-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #7c8ba1;
            cursor: pointer;
            font-size: 16px;
        }

        .progress-bar-container {
            position: relative;
            height: 10px;
            background: #182335;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(
                90deg, #ff4d4d, #ffaa00, #00e5ff, #00ff88
            );
            border-radius: 5px;
            transition: width 0.4s ease;
        }

        .percentage-text {
            position: absolute;
            right: 0;
            top: -24px;
            font-size: 13px;
            font-weight: 600;
            color: #00ff88;
        }

        /* Button Group */
        .button-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .action-btn,
        .clear-btn {
            flex: 1;
            padding: 14px 8px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .action-btn {
            background: linear-gradient(90deg, #0099ff, #00e5ff);
        }

        .clear-btn {
            background: linear-gradient(90deg, #ff4d4d, #ff7676);
        }

        .action-btn:hover,
        .clear-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .checklist {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #7c8ba1;
            transition: color 0.3s;
        }

        .check-item.active {
            color: #ffffff;
        }

        .icon-circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #182335;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            color: #7c8ba1;
            border: 1px solid #28374f;
        }

        .check-item.active .icon-circle {
            background: #00ff88;
            color: #0b111e;
            border-color: #00ff88;
        }

        .analysis-box {
            margin-top: 25px;
            background: rgba(18, 27, 43, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .analysis-info h3 {
            font-size: 16px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .analysis-info p {
            font-size: 13px;
            color: #7c8ba1;
        }

        .crack-time {
            font-size: 13px;
            color: #7c8ba1;
            margin-bottom: 12px;
        }

        .crack-time span {
            color: #00e5ff;
            font-weight: 600;
        }

        .status-emoji {
            font-size: 45px;
            background: rgba(255, 255, 255, 0.05);
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (max-width: 400px) {
            .card {
                padding: 22px;
            }

            .button-group {
                gap: 7px;
            }

            .action-btn,
            .clear-btn {
                font-size: 12px;
                padding: 12px 5px;
            }
        }
    </style>
</head>

<body>

<div class="card">

    <div class="header">
        <h1>Password Strength Analyzer</h1>
        <p>Secure Your Digital Life</p>
    </div>

    <div class="main-content">

        <div>

            <div class="input-group">
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    oninput="checkPassword()"
                >

                <button
                    class="toggle-btn"
                    onclick="toggleVisibility()"
                    type="button"
                    id="toggle-btn"
                >👁️</button>
            </div>

            <div style="position: relative;">
                <span class="percentage-text" id="percentage">0%</span>

                <div class="progress-bar-container">
                    <div class="progress-bar" id="progress"></div>
                </div>
            </div>

            <!-- Copy and Clear Buttons -->

            <div class="button-group">

                <button
                    class="action-btn"
                    onclick="copyPassword()"
                    type="button"
                >
                    📋 Copy Password
                </button>

                <button
                    class="clear-btn"
                    onclick="clearPassword()"
                    type="button"
                >
                    🗑️ Clear
                </button>

            </div>

        </div>

        <ul class="checklist">

            <li class="check-item" id="check-length">
                <span class="icon-circle">✓</span>
                8+ Characters
            </li>

            <li class="check-item" id="check-upper">
                <span class="icon-circle">✓</span>
                Uppercase
            </li>

            <li class="check-item" id="check-lower">
                <span class="icon-circle">✓</span>
                Lowercase
            </li>

            <li class="check-item" id="check-number">
                <span class="icon-circle">✓</span>
                Numbers
            </li>

            <li class="check-item" id="check-symbol">
                <span class="icon-circle">✓</span>
                Symbols
            </li>

        </ul>

    </div>

    <div class="analysis-box">

        <div class="analysis-info">

            <h3>Security Analysis</h3>

            <div class="crack-time">
                Crack Time:
                <span id="crack-time">Instant</span>
            </div>

            <p id="message">
                Enter a password to evaluate its strength.
            </p>

        </div>

        <div class="status-emoji" id="emoji">🥱</div>

    </div>

</div>

<!-- JavaScript Code -->

<script>

    function checkPassword() {

        const password = document.getElementById("password").value;

        const progress = document.getElementById("progress");
        const percentage = document.getElementById("percentage");
        const message = document.getElementById("message");
        const crackTime = document.getElementById("crack-time");
        const emoji = document.getElementById("emoji");

        const checks = {

            length: password.length >= 8,
            upper: /[A-Z]/.test(password),
            lower: /[a-z]/.test(password),
            number: /[0-9]/.test(password),
            symbol: /[^A-Za-z0-9]/.test(password)

        };

        // Update checklist

        document.getElementById("check-length")
            .classList.toggle("active", checks.length);

        document.getElementById("check-upper")
            .classList.toggle("active", checks.upper);

        document.getElementById("check-lower")
            .classList.toggle("active", checks.lower);

        document.getElementById("check-number")
            .classList.toggle("active", checks.number);

        document.getElementById("check-symbol")
            .classList.toggle("active", checks.symbol);

        // Calculate score

        let score = 0;

        if (checks.length) score++;
        if (checks.upper) score++;
        if (checks.lower) score++;
        if (checks.number) score++;
        if (checks.symbol) score++;

        const percentScore = password.length === 0
            ? 0
            : (score / 5) * 100;

        progress.style.width = percentScore + "%";

        percentage.innerText = percentScore + "%";

        // Display results

        if (password.length === 0) {

            message.innerText =
                "Enter a password to evaluate its strength.";

            crackTime.innerText = "Instant";
            emoji.innerText = "🥱";

        } else if (score <= 2) {

            message.innerText =
                "Weak Password. Use more security features.";

            crackTime.innerText = "Few seconds";
            emoji.innerText = "😟";

        } else if (score <= 4) {

            message.innerText =
                "Medium Password. Improve your password strength.";

            crackTime.innerText = "Several hours / days";
            emoji.innerText = "😐";

        } else {

            message.innerText =
                "Excellent! Highly secure!";

            crackTime.innerText = "Centuries";
            emoji.innerText = "😎";

        }

    }


    // Show / Hide Password

    function toggleVisibility() {

        const input = document.getElementById("password");

        input.type = input.type === "password"
            ? "text"
            : "password";

    }


    // Copy Password

    async function copyPassword() {

        const input = document.getElementById("password");

        if (!input.value) {
            alert("Please enter a password first!");
            return;
        }

        try {
            await navigator.clipboard.writeText(input.value);
            alert("Password copied to clipboard!");
        } catch (error) {
            alert("Unable to copy password. Please use HTTPS or localhost.");
        }

    }


    // Clear Password

    function clearPassword() {

        const input = document.getElementById("password");

        // Clear input
        input.value = "";

        // Reset progress bar
        document.getElementById("progress").style.width = "0%";

        // Reset percentage
        document.getElementById("percentage").innerText = "0%";

        // Reset checklist
        document.querySelectorAll(".check-item").forEach(item => {
            item.classList.remove("active");
        });

        // Reset security analysis
        document.getElementById("message").innerText =
            "Enter a password to evaluate its strength.";

        document.getElementById("crack-time").innerText = "Instant";

        // Reset emoji
        document.getElementById("emoji").innerText = "🥱";

        // Hide password again
        input.type = "password";

        // Focus input
        input.focus();

    }

</script>

</body>
</html>
